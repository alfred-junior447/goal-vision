services:
  - type: web
    name: football-prediction-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true

    # Variables d'environnement (à configurer dans le dashboard Render)
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: TIMEZONE
        value: Africa/Douala
      - key: ORANGE_API_KEY
        sync: false
      - key: MTN_API_KEY
        sync: false
      - key: MTN_SUBSCRIPTION_KEY
        sync: false
      - key: WEBHOOK_URL
        sync: false  # Format: https://your-app.onrender.com
